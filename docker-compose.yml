services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # HLS tuning — always enforced; no need to touch these.
      MTX_LOGLEVEL: warn
      MTX_HLSSEGMENTCOUNT: "7"
      MTX_HLSSEGMENTDURATION: 1s
      MTX_HLSALWAYSREMUX: "yes"
      # Camera runOnDemand hooks (MTX_PATHS_CAM*_RUNONDEMAND) are loaded from .env automatically.
      # Add them there — see .env.example for the format.
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    environment:
      # Falls back to the internal service name if not set in .env.
      # Override to http://localhost:8888 when running the app outside Docker for dev.
      MEDIAMTX_URL: ${MEDIAMTX_URL:-http://mediamtx:8888}
    depends_on:
      - mediamtx
    networks:
      - internal

networks:
  internal:
    driver: bridge
