name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release and plugins
        run: npm install --no-save semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/git @semantic-release/github

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Capture latest tag before release
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Detect whether semantic-release actually cut a new version. We build the
      # Docker image here in the same job rather than in a separate workflow
      # triggered by the `release` event: releases created with the default
      # GITHUB_TOKEN do NOT trigger other workflows (GitHub's recursion guard),
      # so a release-triggered build would silently never run.
      - name: Detect new release
        id: ver
        run: |
          after="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          if [ "$after" != "${{ steps.before.outputs.tag }}" ] && [ "$after" != "none" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$after" >> "$GITHUB_OUTPUT"
            echo "Released $after"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.ver.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.ver.outputs.published == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        if: steps.ver.outputs.published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
